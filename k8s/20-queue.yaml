apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
  namespace: ticketing
  labels: { app: queue }
spec:
  replicas: 2
  selector:
    matchLabels: { app: queue }
  template:
    metadata:
      labels: { app: queue }
    spec:
      containers:
        - name: queue
          # 빌드 후 레지스트리에 push 한 이미지로 교체 (예: ghcr.io/ojsung7/...)
          image: ghcr.io/ojsung7/ticketing-queue:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: { name: ticketing-config }
            - secretRef: { name: ticketing-secret }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: queue
  namespace: ticketing
spec:
  selector: { app: queue }
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: queue
  namespace: ticketing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: queue
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
