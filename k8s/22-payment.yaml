apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: ticketing
  labels: { app: payment }
spec:
  replicas: 2
  selector:
    matchLabels: { app: payment }
  template:
    metadata:
      labels: { app: payment }
    spec:
      containers:
        - name: payment
          image: ghcr.io/ojsung7/ticketing-payment:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef: { name: ticketing-config }
            - secretRef: { name: ticketing-secret }
          readinessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: ticketing
spec:
  selector: { app: payment }
  ports:
    - port: 8003
      targetPort: 8003
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment
  namespace: ticketing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
